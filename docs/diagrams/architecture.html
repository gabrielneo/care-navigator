<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Navigator architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Skin: docs/brand/tokens.css (warm palette, 25 Nov 2026). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFF8F0;
      --color-ink: #2B1D14;
      --color-muted: #6A5444;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .frame { max-width: 1080px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>All the logic runs on the phone; the postal code never leaves it</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1040 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Caregiver Navigator architecture</title>
<desc id="architecture-desc">At build time curated rules and two open data layers pass checks and become static JSON; at run time the browser does matching, cost and the postal area lookup, and the postal code never leaves the phone.</desc>

<rect width="100%" height="100%" fill="#FFF8F0"/>
<rect x="24" y="56" width="576" height="252" rx="8" fill="rgba(43,29,20,0.02)" stroke="rgba(43,29,20,0.10)" stroke-width="0.8"/>

<text x="708" y="70" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.1em">RUN · VISITOR'S PHONE</text>

<line x1="584" y1="178" x2="630" y2="178" stroke="#6A5444" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="200" width="160" height="60" rx="6" fill="#FFFDF9" stroke="#3E6A3A" stroke-width="1" stroke-dasharray="4,3"/>
<text x="120" y="226" fill="#2B1D14" font-size="13" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">data.gov.sg</text>
<text x="120" y="245" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace" text-anchor="middle">fsc + cc layers</text>

<rect x="424" y="148" width="160" height="60" rx="6" fill="#FFFDF9" stroke="#8C7461" stroke-width="1"/>
<text x="504" y="174" fill="#2B1D14" font-size="13" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Static JSON</text>
<text x="504" y="193" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace" text-anchor="middle">5 files + hashes</text>
<rect x="632" y="148" width="160" height="60" rx="6" fill="#FFFDF9" stroke="#8C7461" stroke-width="1"/>

<text x="712" y="193" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace" text-anchor="middle">next.js · vercel</text>

<line x1="40" y1="332" x2="1000" y2="332" stroke="#EADBC8"/>
<rect x="40" y="346" width="12" height="12" rx="2" fill="#FCE6D6" stroke="#B0451D"/>
<text x="60" y="357" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace">where the logic lives</text>
<rect x="248" y="346" width="12" height="12" rx="2" fill="#FFFDF9" stroke="#3E6A3A" stroke-dasharray="3,2"/>
<text x="268" y="357" fill="#6A5444" font-size="11" font-family="Geist Mono, monospace">open government data, pulled at build time only</text>
</svg>
    </div>
  </div>
</body>
</html>
