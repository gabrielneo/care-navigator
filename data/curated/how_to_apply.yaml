# How each service is reached, and what to bring. Checked against official pages in docs/verified/source-audit-2026-11-25.md;
# the documents to bring are our judgement (no official list exists) and are not practitioner-reviewed.
always_bring:
  - Her NRIC
  - Your NRIC (as the person arranging care)
  - The hospital discharge summary or doctor's memo, if any
  - A list of her current medicines
  - A rough idea of the monthly income of everyone living at her NRIC address (subsidies are means-tested on it)
routes:
  - apply_id: via_doctor_or_aic_link
    first_contact: Her doctor at the hospital or polyclinic, or an AIC Link
    steps:
      - Ask the doctor to submit an online application for the service.
      - Or visit an AIC Link and they will help you apply.
      - Subsidies are means-tested on household income per person.
    extra_documents:
      - The doctor's referral or the application made by the hospital or polyclinic
    source_id: aic_day_care
  - apply_id: via_ward_msw
    first_contact: The medical social worker on her ward
    steps:
      - Ask before she is discharged. Only the ward's medical social worker can refer her.
    extra_documents: []
    source_id: thk_ics
  - apply_id: via_ward_msw_or_aic
    first_contact: The ward's medical social worker, or her polyclinic doctor
    steps:
      - A hospital, polyclinic or medical social worker refers her after an assessment finds she can't be cared for at home.
    extra_documents:
      - The referral from the hospital or polyclinic
      - Any recent medical reports
    source_id: aic_nursing_home
  - apply_id: via_aic_link
    first_contact: Her doctor, with help from an AIC Link
    steps:
      - A hospital, polyclinic or GP doctor refers her. An AIC Link can help with the application.
      - Apply about 4 weeks before. Each stay is at least 7 days, up to 30 days a year.
    extra_documents: []
    source_id: aic_take_a_break
  - apply_id: via_provider
    first_contact: The centre or provider directly
    steps:
      - Call or walk in and ask what's available.
    extra_documents: []
    source_id: aic_aac
grant_steps:
  - grant_id: home_caregiving_grant
    steps:
      - Get a Functional Assessment Report from an approved doctor, nurse or therapist.
      - Apply online on AIC's eFASS with Singpass.
    source_id: aic_hcg
  - grant_id: levy_concession
    extra_documents:
      - A doctor's certification of the help she needs and AIC's recommendation letter (if applying because of daily activities)
    source_id: mom_levy_concession
