# Service types the planner can suggest. Wording follows docs/specs/08 (not yet practitioner-reviewed).
# setting: home | centre | residential | ward. scheme: which subsidy table applies (null = not MOH-subsidised).
# unit: what one price is for. default_units_per_week: the editable assumption shown on screen 4 (null = not added to the week).
services:
  - service_id: day_care
    name: Day care centre
    official_term: Day Care
    description: A centre where she spends the day with meals, activities and care, while you work or rest.
    setting: centre
    scheme: non_residential
    unit: session
    default_units_per_week: 5
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will we pay each month after the subsidy?"
      - "Is transport included, and what does it cost?"
      - "Which days are you open? Do you take people on weekends?"
      - "Is there a waiting list?"
    source_id: aic_day_care
  - service_id: dementia_day_care
    name: Day care for dementia
    official_term: Dementia Day Care
    description: Day care for people living with dementia, at selected centres.
    setting: centre
    scheme: non_residential
    unit: session
    default_units_per_week: 5
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will we pay each month after the subsidy?"
      - "Do you care for people at her stage of dementia?"
      - "Is transport included, and what does it cost?"
      - "Is there a waiting list?"
    source_id: aic_day_care
  - service_id: day_care_transport
    name: Transport to and from day care
    official_term: Day care transport
    description: Pick-up and drop-off between home and the centre.
    setting: centre
    scheme: null
    unit: month
    default_units_per_week: null
    how_to_apply_id: via_provider
    source_id: aic_day_care
  - service_id: home_personal_care
    name: Help with washing and dressing at home
    official_term: Home Personal Care
    description: A trained care worker comes home to help with washing, dressing, eating and toileting.
    setting: home
    scheme: non_residential
    unit: hour
    block_hours: 4
    default_units_per_week: 3
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will we pay after the subsidy, by the hour or per 4-hour visit?"
      - "Do you need to assess her before you start?"
      - "Is there a waiting list?"
    source_id: aic_home_personal_care
  - service_id: home_nursing
    name: Nurse visits at home
    official_term: Home Nursing
    description: A nurse visits to handle wounds, tubes, injections or medicines.
    setting: home
    scheme: non_residential
    unit: visit
    default_units_per_week: 1
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will we pay after the subsidy for each visit?"
      - "Can the nurse handle her wounds, tubes or medicines?"
      - "Is there a waiting list?"
    source_id: aic_home_nursing
  - service_id: home_therapy
    name: Therapy at home
    official_term: Home Therapy
    description: Physiotherapy, occupational or speech therapy at home, to help her regain everyday abilities.
    setting: home
    scheme: non_residential
    unit: visit
    default_units_per_week: 1
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will we pay after the subsidy for each visit?"
      - "Which therapy will she get: physio, occupational or speech?"
    source_id: aic_home_therapy
  - service_id: medical_escort
    name: Escort to appointments
    official_term: Medical Escort and Transport
    description: Transport to medical appointments, with someone to go with her.
    setting: home
    scheme: non_residential
    unit: trip
    default_units_per_week: 1
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What does each round trip cost after the subsidy?"
      - "Can you take her in a wheelchair?"
    source_id: aic_met
  - service_id: meals_on_wheels
    name: Meals delivered
    official_term: Meals on Wheels
    description: Meals delivered to her home when she can't buy or prepare her own.
    setting: home
    scheme: non_residential
    unit: meal
    default_units_per_week: 5
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What does each meal cost after the subsidy?"
      - "Can you do a special diet, such as halal, vegetarian or soft food?"
      - "Can you bring lunch, dinner or both?"
    source_id: aic_mow
  - service_id: respite
    name: A break for you
    official_term: Nursing Home Respite Care
    description: Full-time care at a nursing home for at least 7 days, so you can rest.
    setting: residential
    scheme: residential
    unit: day
    default_units_per_week: null
    how_to_apply_id: via_aic_link
    ask_provider:
      - "How much notice do you need?"
      - "What does each day cost after the subsidy?"
    source_id: aic_nh_respite
  - service_id: active_ageing_centre
    name: Activities and company nearby
    official_term: Active Ageing Centre
    description: A neighbourhood centre for activities, exercise and befriending.
    setting: centre
    scheme: null
    unit: null
    default_units_per_week: null
    how_to_apply_id: via_provider
    source_id: aic_aac
  - service_id: interim_caregiver_service
    name: Short-term carer after discharge
    official_term: Interim Caregiver Service
    description: A carer at home for up to 2 weeks after discharge. Only the ward's medical social worker can refer her, while she is in hospital.
    setting: ward
    scheme: null
    unit: null
    default_units_per_week: null
    ward_only: true
    how_to_apply_id: via_ward_msw
    source_id: thk_ics
  - service_id: nursing_home
    name: Nursing home
    official_term: Nursing Home
    description: Full-time care in a home, for when care at home isn't enough.
    setting: residential
    scheme: residential
    unit: month
    default_units_per_week: null
    how_to_apply_id: via_ward_msw_or_aic
    source_id: aic_nursing_home
  - service_id: home_palliative_care
    name: Palliative care at home
    official_term: Home Palliative Care
    description: Care at home for someone with a serious illness, when doctors expect less than a year. It supports the family too.
    setting: home
    scheme: null
    unit: null
    how_to_apply_id: via_doctor_or_aic_link
    ask_provider:
      - "What will it cost? Can a medical social worker help with the fees?"
      - "How soon can you start, and who do we call at night?"
    source_id: aic_home_palliative
