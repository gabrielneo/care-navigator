# Runs on every push and pull request: pipeline tests, the data contract (schema and types up to date),
# the TypeScript typecheck, the engine tests, the static build and the end-to-end checks.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline -q
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Schema and types match the pipeline models (docs/specs/10)
        run: |
          python -m pipeline.export_schema
          (cd web && npm run gen:types)
          git diff --exit-code web/src/lib/data/
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Static build
        run: npm run build
        working-directory: web
      - name: End-to-end, accessibility and privacy checks in Chromium, WebKit and Firefox (Stage 6)
        run: |
          npx playwright install --with-deps chromium webkit firefox
          npm run e2e
        working-directory: web
